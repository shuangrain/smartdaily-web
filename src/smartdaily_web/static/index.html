<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>社區公告與個人通知</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="社區通知" />
  <link rel="apple-touch-icon" href="/static/icon@2x.png" />
  <link rel="icon" type="image/png" href="/static/icon.png" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #26354d;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --accent: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 0 16px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand img {
      width: 34px;
      height: 34px;
      border-radius: 8px;
    }
    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .brand-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 9px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn:hover { background: var(--card-hover); }
    .btn:disabled { cursor: not-allowed; opacity: 0.7; }
    .btn:disabled:hover { background: var(--card); }
    .btn-primary {
      background: var(--primary-dark);
      border-color: var(--primary);
    }
    .btn-primary:hover { background: var(--primary); }
    .btn-accent {
      background: #059669;
      border-color: var(--accent);
    }
    .btn-danger {
      background: #dc2626;
      border-color: var(--danger);
    }
    .tabs {
      display: flex;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 10px 6px;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 16px 80px 16px;
    }
    .push-banner {
      background: linear-gradient(135deg, #1e3a8a, #1e293b);
      border: 1px solid #3b82f655;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .push-banner.visible { display: block; }
    .push-banner h3 {
      margin: 0 0 6px 0;
      font-size: 0.98rem;
    }
    .push-banner p {
      margin: 0 0 10px 0;
      font-size: 0.84rem;
      color: #cbd5e1;
    }
    .push-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .filter-bar {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .filter-bar.visible {
      display: flex;
    }
    .filter-chip {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-chip:hover {
      background: var(--card-hover);
      color: var(--text);
    }
    .filter-chip.active {
      background: var(--primary-dark);
      color: #fff;
      border-color: var(--primary);
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: transform 0.12s, background 0.15s;
    }
    .card:hover { background: var(--card-hover); }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .badge-top { background: #f59e0b22; color: #fbbf24; border: 1px solid #f59e0b66; }
    .badge-type { background: #3b82f622; color: #60a5fa; border: 1px solid #3b82f655; }
    .badge-unread { background: #ef444422; color: #f87171; border: 1px solid #ef444466; }
    .badge-deleted { background: #ef444433; color: #fca5a5; border: 1px solid #ef444488; }
    .card.is-deleted { border-color: #ef444455; opacity: 0.88; }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 0 0 6px 0;
      color: var(--text);
    }
    .card-preview {
      font-size: 0.88rem;
      color: #cbd5e1;
      margin: 0;
      white-space: pre-line;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-preview.expanded {
      display: block;
      -webkit-line-clamp: unset;
    }
    .notif-images {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .notif-images img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    /* Modal for Announcement Detail & Attachments */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--card);
      width: 100%;
      max-width: 760px;
      max-height: 88vh;
      border-radius: 18px 18px 0 0;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.4;
    }
    .modal-body {
      padding: 16px;
      overflow-y: auto;
      white-space: pre-line;
      font-size: 0.93rem;
      color: #e2e8f0;
    }
    .attachments-box {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .attachments-box h4 {
      margin: 0 0 10px 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .attachment-item {
      margin-bottom: 12px;
    }
    .attachment-item img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: block;
      margin-top: 6px;
    }
    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172aee;
      border: 1px solid var(--primary);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.86rem;
      z-index: 100;
      display: none;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="brand">
        <img src="/static/icon.png" alt="Logo" />
        <div>
          <div class="brand-title" id="communityName">載入社區中...</div>
          <div class="brand-sub" id="statusSub">智生活社區公告與個人通知</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn" id="togglePushPanelBtn" title="推播通知設定">🔔 推播</button>
        <button class="btn" id="refreshBtn" title="立即更新公告與提醒">⚡ 立即更新</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="announcements">📢 社區公告</button>
      <button class="tab-btn" data-tab="reminders">📬 我的提醒</button>
    </div>
  </header>

  <main>
    <section class="push-banner" id="pushBanner">
      <h3>📱 iOS / 瀏覽器 Web Push 推播設定</h3>
      <p id="pushHint">
        若使用 iPhone / iPad (iOS 16.4+)，請先點選 Safari 底部的「分享 ➔ 加入主畫面」，並從主畫面開啟本程式後點擊下方按鈕啟用通知。
      </p>
      <div class="push-actions">
        <button class="btn btn-primary" id="enablePushBtn">🔔 開啟推播通知</button>
        <button class="btn btn-danger" id="disablePushBtn" style="display:none;">🔕 取消推播通知</button>
        <button class="btn btn-accent" id="testPushBtn">📨 發送測試推播</button>
      </div>
    </section>

    <div class="filter-bar" id="reminderFilterBar">
      <button class="filter-chip active" data-filter="all">全部</button>
      <button class="filter-chip" data-filter="postal">📦 郵務包裹</button>
      <button class="filter-chip" data-filter="Col">🔑 寄放物</button>
      <button class="filter-chip" data-filter="Ann">📢 社區公告</button>
      <button class="filter-chip" data-filter="CommunityPushNotification">🔔 個人通知</button>
      <button class="filter-chip" data-filter="other">📬 其他</button>
    </div>

    <div id="contentArea" class="card-list">
      <div class="empty-state">載入資料中...</div>
    </div>
    <div id="scrollSentinel" style="text-align:center; margin-top:18px; padding:10px; font-size:0.84rem; color:var(--muted); display:none;"></div>
  </main>

  <div class="modal-backdrop" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <div>
          <div class="card-meta" id="modalMeta"></div>
          <h2 id="modalTitle">公告詳情</h2>
        </div>
        <button class="btn" id="closeModalBtn">✕ 關閉</button>
      </div>
      <div class="modal-body">
        <div id="modalContent"></div>
        <div class="attachments-box" id="modalAttachments" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let currentTab = "announcements";
    let currentReminderFilter = "all";
    let loadedReminders = [];
    let swRegistration = null;
    let currentOffset = 0;
    let nextBeforeDatetime = "";
    let hasMoreData = false;
    let isLoadingMore = false;
    let autoLoadErrorPaused = false;
    let loadGeneration = 0;
    let pollIsRunning = false;
    let manualPollPending = false;
    const POLL_STATUS_REFRESH_INTERVAL_MS = 1000;

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 3200);
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    function updateRefreshButton() {
      const refreshButton = document.getElementById("refreshBtn");
      const isBusy = pollIsRunning || manualPollPending;
      refreshButton.disabled = isBusy;
      refreshButton.textContent = isBusy ? "⏳ 更新中" : "⚡ 立即更新";
      refreshButton.setAttribute("aria-busy", String(isBusy));
    }

    async function loadStatus() {
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        pollIsRunning = Boolean(data.poll?.is_running);
        updateRefreshButton();
        document.getElementById("communityName").textContent = data.community_name || "社區通知";
        document.getElementById("statusSub").textContent =
          `已濾除平台廣告 ｜ 推播訂閱裝置：${data.subscribers_count} 台`;
      } catch (e) {
        console.error(e);
      }
    }

    function updateScrollSentinel() {
      const sentinel = document.getElementById("scrollSentinel");
      const hasCards = document.querySelectorAll("#contentArea .card").length > 0;
      if (isLoadingMore) {
        sentinel.style.display = "block";
        sentinel.textContent = "⏳ 載入更多中...";
      } else if (hasMoreData) {
        sentinel.style.display = "block";
        sentinel.textContent = autoLoadErrorPaused
          ? "⚠️ 載入失敗，繼續下滑將自動重試"
          : "⬇️ 向下滑動自動載入更多";
      } else if (hasCards) {
        sentinel.style.display = "block";
        sentinel.textContent = "— 已顯示全部紀錄 —";
      } else {
        sentinel.style.display = "none";
        sentinel.textContent = "";
      }
    }

    function maybeAutoLoadMore() {
      if (!hasMoreData || isLoadingMore || autoLoadErrorPaused) return;
      const sentinel = document.getElementById("scrollSentinel");
      if (!sentinel || sentinel.style.display === "none") return;
      const rect = sentinel.getBoundingClientRect();
      if (rect.top <= window.innerHeight + 260) {
        loadTabContent(currentTab, true);
      }
    }

    async function loadTabContent(tab, append = false) {
      if (append && (isLoadingMore || !hasMoreData)) return;
      const gen = append ? loadGeneration : ++loadGeneration;
      if (!append) {
        currentTab = tab;
        currentOffset = 0;
        nextBeforeDatetime = "";
        hasMoreData = false;
        isLoadingMore = false;
        autoLoadErrorPaused = false;
        if (tab === "reminders") {
          loadedReminders = [];
        }
        document.querySelectorAll(".tab-btn").forEach((b) => {
          b.classList.toggle("active", b.dataset.tab === tab);
        });
        document.getElementById("reminderFilterBar").classList.toggle("visible", tab === "reminders");
        document.getElementById("contentArea").innerHTML = `<div class="empty-state">載入中...</div>`;
        updateScrollSentinel();
      } else {
        isLoadingMore = true;
        autoLoadErrorPaused = false;
        updateScrollSentinel();
      }

      try {
        if (tab === "announcements") {
          const res = await fetch(`/api/announcements?offset=${currentOffset}&max_count=10`);
          const data = await res.json();
          if (gen !== loadGeneration) return;
          const items = data.items || [];
          hasMoreData = Boolean(data.has_more);
          currentOffset += 10;
          renderAnnouncements(items, append);
        } else if (tab === "reminders") {
          const res = await fetch(`/api/notifications/reminders?offset=${currentOffset}&max_count=10`);
          const data = await res.json();
          if (gen !== loadGeneration) return;
          const items = data.items || [];
          hasMoreData = Boolean(data.has_more);
          currentOffset += 10;
          loadedReminders = append ? loadedReminders.concat(items) : items;
          renderReminders();
        }
      } catch (err) {
        if (gen !== loadGeneration) return;
        if (!append) {
          document.getElementById("contentArea").innerHTML = `<div class="empty-state">載入失敗：${err.message}</div>`;
        } else {
          autoLoadErrorPaused = true;
          showToast("載入更多失敗：" + err.message);
        }
      } finally {
        if (gen === loadGeneration) {
          isLoadingMore = false;
          updateScrollSentinel();
          requestAnimationFrame(maybeAutoLoadMore);
        }
      }
    }

    function renderAnnouncements(items, append = false) {
      const container = document.getElementById("contentArea");
      if (!append) {
        if (!items.length) {
          container.innerHTML = `<div class="empty-state">目前沒有社區公告</div>`;
          return;
        }
        container.innerHTML = "";
      }
      items.forEach((ann) => {
        const card = document.createElement("div");
        card.className = ann.is_deleted ? "card is-deleted" : "card";
        const deletedBadge = ann.is_deleted ? `<span class="badge badge-deleted">🗑️ 已回收</span>` : "";
        const topBadge = ann.is_top ? `<span class="badge badge-top">📌 置頂</span>` : "";
        const typeBadge = `<span class="badge badge-type">${escapeHtml(ann.type_name || "公告")}</span>`;
        const preview = escapeHtml(ann.content || "（點擊查看附件或詳細內容）");
        const dateStr = escapeHtml(ann.start_date ? ann.start_date.slice(0, 10) : ann.create_date);
        card.innerHTML = `
          <div class="card-meta">
            ${deletedBadge}
            ${topBadge}
            ${typeBadge}
            <span>📅 ${dateStr}</span>
          </div>
          <h3 class="card-title">${escapeHtml(ann.title)}</h3>
          <p class="card-preview">${preview}</p>
        `;
        card.addEventListener("click", () => openAnnouncementDetail(ann.id, ann));
        container.appendChild(card);
      });
    }

    async function openAnnouncementDetail(id, fallbackAnn) {
      const modal = document.getElementById("detailModal");
      const titleEl = document.getElementById("modalTitle");
      const metaEl = document.getElementById("modalMeta");
      const contentEl = document.getElementById("modalContent");
      const attachBox = document.getElementById("modalAttachments");

      titleEl.textContent = fallbackAnn ? fallbackAnn.title : "載入中...";
      metaEl.textContent = fallbackAnn ? `發布時間：${fallbackAnn.create_date || fallbackAnn.start_date}` : "";
      contentEl.textContent = "正在讀取本地公告備份...";
      attachBox.style.display = "none";
      attachBox.innerHTML = "";
      modal.classList.add("open");

      try {
        const res = await fetch(`/api/announcements/${encodeURIComponent(id)}`);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        const detail = await res.json();
        const isDeleted = Boolean(detail.is_deleted || fallbackAnn?.is_deleted);
        const delText = escapeHtml(detail.error_description || "已回收");
        const deletedBadge = isDeleted ? `<span class="badge badge-deleted">🗑️ ${delText}</span> ` : "";
        titleEl.textContent = detail.title || fallbackAnn?.title || "公告詳情";
        const dateLabel = detail.create_date || fallbackAnn?.create_date || fallbackAnn?.start_date || "";
        metaEl.innerHTML = `${deletedBadge}<span class="badge badge-type">${escapeHtml(detail.type_name || "公告")}</span>${dateLabel ? ` <span>📅 ${escapeHtml(dateLabel)}</span>` : ""}`;
        if (detail.detail_unavailable) {
          contentEl.textContent = detail.content
            ? `${detail.content}\n\n目前只有提醒中的摘要，沒有公告全文或附件。`
            : "本機只保存了這則提醒，沒有這則公告的完整內容或附件。";
        } else if (detail.content || fallbackAnn?.content) {
          contentEl.textContent = detail.content || fallbackAnn?.content;
        } else if (detail.error_description) {
          contentEl.textContent = `⚠️ 智生活雲端回應：「${detail.error_description}」\n\n此公告於本服務部署前已由社區下架或刪除回收，因此智生活雲端與本地皆無留存原始內文與附件。`;
        } else {
          contentEl.textContent = "（本公告無文字內文，請參閱下方附件）";
        }

        if (detail.attachments && detail.attachments.length > 0) {
          attachBox.style.display = "block";
          attachBox.innerHTML = `<h4>📎 本地公告附件備份（共 ${detail.attachments.length} 個）</h4>`;
          detail.attachments.forEach((att) => {
            const div = document.createElement("div");
            div.className = "attachment-item";
            const safeFilename = escapeHtml(att.filename);
            if (att.type === "image") {
              div.innerHTML = `
                <a class="btn" href="${att.url}" target="_blank" rel="noopener">🖼️ 開啟原圖 (${safeFilename})</a>
                <img src="${att.url}" alt="${safeFilename}" loading="lazy" />
              `;
            } else if (att.type === "pdf") {
              div.innerHTML = `
                <a class="btn btn-primary" href="${att.url}" target="_blank" rel="noopener">📄 開啟 PDF 文件 (${safeFilename})</a>
              `;
            } else {
              div.innerHTML = `
                <a class="btn" href="${att.url}" target="_blank" rel="noopener">📎 下載附件 (${safeFilename})</a>
              `;
            }
            attachBox.appendChild(div);
          });
        }
      } catch (err) {
        contentEl.textContent = `載入詳情失敗：${err.message}`;
      }
    }

    function getReminderFilterGroup(featureName) {
      const fn = String(featureName || "").trim();
      if (fn === "postal") return "postal";
      if (fn === "Col") return "Col";
      if (fn === "Ann") return "Ann";
      if (fn === "CommunityPushNotification" || fn === "Msg") return "CommunityPushNotification";
      return "other";
    }

    function renderReminders() {
      const container = document.getElementById("contentArea");
      const featureLabels = {
        postal: "📦 郵務包裹",
        Col: "🔑 寄放物",
        CommunityPushNotification: "🔔 個人通知",
        Msg: "🔔 個人通知",
        Ann: "📢 社區公告",
        Bill: "💳 帳單繳費",
        payment: "💳 帳單繳費",
        Gas: "🔥 瓦斯抄表",
        Res: "📅 公設預約",
        vote: "🗳️ 社區投票",
        feedback: "💬 意見反映",
      };
      const filtered = loadedReminders.filter((item) => {
        if (currentReminderFilter === "all") return true;
        return getReminderFilterGroup(item.feature_name) === currentReminderFilter;
      });
      if (!filtered.length) {
        container.innerHTML = `<div class="empty-state">目前此分類沒有提醒紀錄</div>`;
        return;
      }
      container.innerHTML = "";
      filtered.forEach((item) => {
        const card = document.createElement("div");
        card.className = item.is_deleted ? "card is-deleted" : "card";
        const deletedBadge = item.is_deleted ? `<span class="badge badge-deleted">🗑️ 已回收</span>` : "";
        const tagLabel = escapeHtml(featureLabels[item.feature_name] || "📬 其他提醒");
        const unreadBadge = !item.has_read ? `<span class="badge badge-unread">未讀</span>` : "";
        const localTime = item.pushing_time ? new Date(item.pushing_time).toLocaleString("zh-TW") : "";
        let imagesHtml = "";
        if (item.files && item.files.length > 0) {
          imagesHtml =
            `<div class="notif-images">` +
            item.files
              .filter((f) => f.Url || f.url)
              .map((f) => {
                const imgUrl = escapeHtml(f.Url || f.url);
                return `<a href="${imgUrl}" target="_blank" rel="noopener"><img src="${imgUrl}" alt="附件圖片" loading="lazy" /></a>`;
              })
              .join("") +
            `</div>`;
        }
        card.innerHTML = `
          <div class="card-meta">
            ${deletedBadge}
            ${unreadBadge}
            <span class="badge badge-type">${tagLabel}</span>
            <span>🕒 ${escapeHtml(localTime)}</span>
          </div>
          <h3 class="card-title">${escapeHtml(item.title)}</h3>
          <p class="card-preview expanded">${escapeHtml(item.body)}</p>
          ${imagesHtml}
        `;
        if (item.feature_name === "Ann" && item.target_id) {
          card.addEventListener("click", () =>
            openAnnouncementDetail(item.target_id, {
              title: item.body,
              create_date: localTime,
            })
          );
        }
        container.appendChild(card);
      });
    }

    async function initServiceWorker() {
      if (!("serviceWorker" in navigator)) return;
      try {
        swRegistration = await navigator.serviceWorker.register("/sw.js");
        navigator.serviceWorker.addEventListener("message", async (event) => {
          if (event.data && event.data.type === "NAVIGATE" && event.data.url) {
            await clearAppBadgeIfSupported();
            const targetUrl = new URL(event.data.url, window.location.origin);
            const tabParam = targetUrl.searchParams.get("tab");
            const idParam = targetUrl.searchParams.get("id");
            if (tabParam && ["announcements", "reminders"].includes(tabParam)) {
              await loadTabContent(tabParam);
            }
            if (idParam) {
              openAnnouncementDetail(idParam, null);
            }
          }
        });
        await updatePushUIState();
      } catch (e) {
        console.warn("SW register failed:", e);
      }
    }

    async function updatePushUIState() {
      const enableBtn = document.getElementById("enablePushBtn");
      const disableBtn = document.getElementById("disablePushBtn");
      const toggleBtn = document.getElementById("togglePushPanelBtn");
      if (!swRegistration || !("pushManager" in swRegistration)) return;
      try {
        const sub = await swRegistration.pushManager.getSubscription();
        if (sub) {
          enableBtn.style.display = "none";
          disableBtn.style.display = "inline-flex";
          toggleBtn.textContent = "🟢 推播已開";
        } else {
          enableBtn.style.display = "inline-flex";
          disableBtn.style.display = "none";
          toggleBtn.textContent = "🔔 推播";
        }
      } catch (e) {
        console.warn("Failed to check subscription:", e);
      }
    }

    async function subscribeWebPush() {
      if (!("Notification" in window) || !("PushManager" in window)) {
        showToast("⚠️ 目前瀏覽器環境尚未支援 Web Push（iOS 請先加入主畫面）");
        return;
      }
      const permission = await Notification.requestPermission();
      if (permission !== "granted") {
        showToast("❌ 您未允許通知權限");
        return;
      }
      try {
        if (!swRegistration) {
          swRegistration = await navigator.serviceWorker.ready;
        }
        const keyRes = await fetch("/api/push/vapid-public-key");
        const { public_key } = await keyRes.json();
        const sub = await swRegistration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(public_key),
        });
        await fetch("/api/push/subscribe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(sub.toJSON()),
        });
        showToast("✅ 已成功開啟 Web Push 推播通知！");
        await updatePushUIState();
        await loadStatus();
      } catch (err) {
        showToast("訂閱失敗：" + err.message);
      }
    }

    async function unsubscribeWebPush() {
      try {
        if (!swRegistration) {
          swRegistration = await navigator.serviceWorker.ready;
        }
        const sub = await swRegistration.pushManager.getSubscription();
        if (sub) {
          await fetch("/api/push/unsubscribe", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ endpoint: sub.endpoint }),
          });
          await sub.unsubscribe();
        }
        showToast("🔕 已取消本裝置的推播通知");
        await updatePushUIState();
        await loadStatus();
      } catch (err) {
        showToast("取消訂閱失敗：" + err.message);
      }
    }

    async function clearAppBadgeIfSupported() {
      if ("clearAppBadge" in navigator) {
        try {
          await navigator.clearAppBadge();
        } catch (_) {}
      }
    }

    async function sendTestPush() {
      try {
        const registration = await navigator.serviceWorker.ready;
        const subscription = await registration.pushManager.getSubscription();
        if (!subscription) {
          showToast("⚠️ 請先在此裝置開啟推播通知");
          return;
        }

        const res = await fetch("/api/push/test", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ endpoint: subscription.endpoint }),
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || "目前裝置無法接收推播");
        }
        if (data.sent === 1) {
          showToast("📨 已發送測試推播至目前裝置！");
        } else {
          showToast("⚠️ 目前裝置未能接收測試推播");
        }
      } catch (e) {
        showToast("發送失敗：" + e.message);
      }
    }

    // Event bindings
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        clearAppBadgeIfSupported();
        loadTabContent(btn.dataset.tab);
      });
    });
    document.querySelectorAll(".filter-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        currentReminderFilter = chip.dataset.filter;
        document.querySelectorAll(".filter-chip").forEach((c) => {
          c.classList.toggle("active", c.dataset.filter === currentReminderFilter);
        });
        renderReminders();
        updateScrollSentinel();
        requestAnimationFrame(maybeAutoLoadMore);
      });
    });
    document.getElementById("refreshBtn").addEventListener("click", async () => {
      if (manualPollPending) return;
      clearAppBadgeIfSupported();
      manualPollPending = true;
      updateRefreshButton();
      try {
        const beforeResponse = await fetch("/api/status");
        const beforeStatus = await beforeResponse.json();
        pollIsRunning = Boolean(beforeStatus.poll?.is_running);
        updateRefreshButton();
        const previousTraceId = beforeStatus.poll?.last_trace_id;
        const res = await fetch("/api/poll-now", { method: "POST" });
        const data = await res.json();
        showToast(data.started ? "🔄 正在更新公告與提醒..." : "⏳ 背景更新已在執行中");

        let observedPoll = pollIsRunning;
        while (true) {
          await new Promise((resolve) => setTimeout(resolve, 1000));
          const statusResponse = await fetch("/api/status");
          const statusData = await statusResponse.json();
          const poll = statusData.poll || {};
          if (poll.is_running || (poll.last_trace_id && poll.last_trace_id !== previousTraceId)) {
            observedPoll = true;
          }
          pollIsRunning = Boolean(poll.is_running);
          updateRefreshButton();
          if (observedPoll && !pollIsRunning) break;
        }

        await loadTabContent(currentTab);
        showToast("✅ 公告與提醒已更新");
      } catch (err) {
        showToast("更新失敗：" + err.message);
      } finally {
        manualPollPending = false;
        await loadStatus();
      }
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        clearAppBadgeIfSupported();
        loadStatus();
      }
    });
    window.addEventListener("focus", clearAppBadgeIfSupported);
    document.getElementById("togglePushPanelBtn").addEventListener("click", () => {
      document.getElementById("pushBanner").classList.toggle("visible");
    });
    document.getElementById("enablePushBtn").addEventListener("click", subscribeWebPush);
    document.getElementById("disablePushBtn").addEventListener("click", unsubscribeWebPush);
    document.getElementById("testPushBtn").addEventListener("click", sendTestPush);
    window.addEventListener(
      "scroll",
      () => {
        if (autoLoadErrorPaused) autoLoadErrorPaused = false;
        maybeAutoLoadMore();
      },
      { passive: true }
    );
    if ("IntersectionObserver" in window) {
      const sentinelObserver = new IntersectionObserver(
        (entries) => {
          if (entries.some((e) => e.isIntersecting)) {
            maybeAutoLoadMore();
          }
        },
        { rootMargin: "260px" }
      );
      sentinelObserver.observe(document.getElementById("scrollSentinel"));
    }
    document.getElementById("closeModalBtn").addEventListener("click", () => {
      document.getElementById("detailModal").classList.remove("open");
    });
    document.getElementById("detailModal").addEventListener("click", (e) => {
      if (e.target.id === "detailModal") {
        document.getElementById("detailModal").classList.remove("open");
      }
    });

    // Boot
    window.addEventListener("DOMContentLoaded", async () => {
      await clearAppBadgeIfSupported();
      await initServiceWorker();
      await loadStatus();
      window.setInterval(() => {
        if (document.visibilityState === "visible") loadStatus();
      }, POLL_STATUS_REFRESH_INTERVAL_MS);
      const params = new URLSearchParams(window.location.search);
      const tabParam = params.get("tab");
      const idParam = params.get("id");
      if (tabParam && ["announcements", "reminders"].includes(tabParam)) {
        await loadTabContent(tabParam);
      } else {
        await loadTabContent("announcements");
      }
      if (idParam) {
        openAnnouncementDetail(idParam, null);
      }
    });
  </script>
</body>
</html>
